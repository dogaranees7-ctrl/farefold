name: Quality checks

on:
  push:
    branches:
      - chatgpt/farefold-current
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, dependency audit, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency tree
        shell: bash
        run: |
          npm audit --json > npm-audit.json || audit_exit=$?
          echo "npm audit exit code: ${audit_exit:-0}"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log(JSON.stringify({
              metadata: report.metadata?.vulnerabilities ?? {},
              advisories: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
                name,
                severity: item.severity,
                direct: item.isDirect,
                installedRange: item.range,
                fixAvailable: item.fixAvailable
              }))
            }, null, 2));
          '

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
