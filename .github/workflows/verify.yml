name: FareFold verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking dependency security fixes
        run: |
          npm install next@16.4.4 eslint-config-next@16.4.4 --save-exact
          npm audit fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply available dependency security fixes"
            git push origin HEAD:master
          fi

      - name: Dependency security audit (report only)
        run: |
          npm audit --json > /tmp/farefold-audit.json || true
          node -e 'const a=require("/tmp/farefold-audit.json"); console.log("Vulnerability totals:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log([item.severity, name, item.range, item.fixAvailable ? "fix available" : "no automatic fix"].join(" | "));'

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/farefold-next.log 2>&1 &
          echo $! > /tmp/farefold-next.pid

      - name: Wait for production server
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/farefold-next.log
          exit 1

      - name: Smoke test production routes
        run: |
          for route in \
            / \
            /businesses /businesses/pizza-restaurant /businesses/bakery-business \
            /branding /products /products/pizza-boxes /products/snack-boxes \
            /packaging /custom /guidelines \
            /guidelines/how-to-build-a-restaurant-brand \
            /guidelines/how-to-plan-packaging-quantities /contact /privacy; do
            echo "Checking $route"
            curl --fail --silent --show-error --location --max-time 20 "http://127.0.0.1:3000$route" > /dev/null
          done
          echo "Checking robots.txt"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/robots.txt > /dev/null
          echo "Checking sitemap.xml response"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/sitemap.xml > /dev/null

      - name: Show server log on failure
        if: failure()
        run: test -f /tmp/farefold-next.log && cat /tmp/farefold-next.log || true
