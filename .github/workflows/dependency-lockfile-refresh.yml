name: Dependency lockfile refresh

on:
  push:
    branches:
      - chatgpt/farefold-current
    paths:
      - package.json
      - .github/workflows/dependency-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/farefold-current
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean install
        run: npm ci
      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit-after.json || audit_exit=$?
          node -e 'const r=require("./npm-audit-after.json"); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities ?? {}, advisories:Object.entries(r.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))'
          echo "npm audit exit code: ${audit_exit:-0}"
      - name: Run ESLint
        run: npm run lint
      - name: Build production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for patched dependencies"
          git push origin HEAD:chatgpt/farefold-current
