name: Dependency lockfile refresh

on:
  push:
    branches:
      - chatgpt/farefold-current
    paths:
      - package.json
      - .github/workflows/dependency-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean install and audit
        run: |
          npm ci
          npm audit --json > npm-audit-after.json || audit_exit=$?
          node -e 'const r=require("./npm-audit-after.json"); console.log(JSON.stringify(r.metadata?.vulnerabilities ?? {}, null, 2))'
          echo "npm audit exit code: ${audit_exit:-0}"
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          retention-days: 3
